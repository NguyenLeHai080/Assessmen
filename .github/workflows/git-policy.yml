name: Git policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev, staging, prod]

permissions:
  contents: read

jobs:
  validate-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            dev:feat/*|dev:fix/*|dev:staging|dev:prod|staging:dev|staging:prod|prod:staging|prod:hotfix/*) ;;
            *)
              echo "Invalid Gitflow route: $HEAD -> $BASE"
              exit 1
              ;;
          esac

  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Conventional Commits and issue IDs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|docs|chore|style|perf|vendor|test|ci|build|revert)(\([a-z0-9._-]+\))?!?: .+( #[0-9]+| \(#[0-9]+\))$'
          failed=0

          while IFS= read -r message; do
            if [[ "$message" =~ ^Merge\  || "$message" =~ ^Revert\  ]]; then
              continue
            fi
            if ! [[ "$message" =~ $pattern ]]; then
              echo "Invalid commit: $message"
              failed=1
            fi
          done < <(git log --format='%s' "$BASE_SHA..$HEAD_SHA")

          if [[ "$failed" -ne 0 ]]; then
            echo 'Expected: type(scope): description #issue-id or type(scope): description (#pull-request)'
            exit 1
          fi
